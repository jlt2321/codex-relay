<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>JLT Relay Web Preview</title>
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">JLT Relay</p>
        <h1>Web Preview Ready</h1>
        <p class="summary">Local preview entry proxied through JLT Relay.</p>
        <dl class="status-grid">
          <div>
            <dt>Entry target</dt>
            <dd>127.0.0.1:30000</dd>
          </div>
          <div>
            <dt>Current host</dt>
            <dd id="current-host">-</dd>
          </div>
          <div>
            <dt>Loaded at</dt>
            <dd id="loaded-at">-</dd>
          </div>
        </dl>
        <div class="section-header">
          <h2>Targets</h2>
          <button class="refresh-button" id="refresh-targets" type="button">Refresh</button>
        </div>
        <div class="target-list" id="target-list" aria-live="polite">
          <div class="target-card muted">Checking local preview targets...</div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
